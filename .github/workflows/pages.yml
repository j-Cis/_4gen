# .github/workflows/pages.yml
name: GitHub Pages

on:
  push:
    branches:
      - main # lub master, zależnie jak nazywa się twoja główna gałąź

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: 'latest'

      - name: Build with Trunk
        # UWAGA: Podmień /_4gen/ na dokładną nazwę twojego repozytorium na GitHubie,
        # jeśli różni się wielkością liter (np. /_4gen/ lub /4gen/)
        run: trunk build --release --public-url /_4gen/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4