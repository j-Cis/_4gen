[package]
name = "_4gen"
version = "0.1.0-dev.1"
authors = ["Jan Roman Cisowski „j-Cis” <code@cisowscy.com>"]
edition = "2024"
rust-version = "1.99.0"
repository = "https://github.com/j-Cis/_4gen"
resolver = "3"

[lib]
name = "x"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
